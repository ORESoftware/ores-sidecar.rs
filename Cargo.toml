[package]
name = "ores-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Shared configuration and runtime-update contracts for ORESoftware sidecars"
repository = "https://github.com/ORESoftware/ores-sidecar.rs"

[dependencies]
basic-toml = "=0.1.10"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.16"

[dev-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"
